services:
  database:
    image: postgres:15-alpine
    container_name: loan-application-manager-database
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d/
    networks:
      - loan-net

  migrate:
    build:
      context: .
      dockerfile: scripts/migrate/Dockerfile
    container_name: loan_prisma_migrate
    depends_on:
      - database
    env_file:
      - .env
      - ./backend/.env
    networks:
      - loan-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: loan_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
      - ./backend/.env
    volumes:
      - ./backend:/app
    working_dir: /app
    command: npm run dev
    depends_on:
      - migrate
    networks:
      - loan-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: loan_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend
    networks:
      - loan-net

volumes:
  pgdata:

networks:
  loan-net:
