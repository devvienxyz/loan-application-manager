services:
  database:
    image: postgres:15-alpine
    container_name: loan_app_mgr_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - loan-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: loan_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      # - ./node_modules:/repo/node_modules
    working_dir: /app
    depends_on:
      - database
    networks:
      - loan-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: loan_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./node_modules:/repo/node_modules
    working_dir: /app
    depends_on:
      - backend
    networks:
      - loan-net

volumes:
  pgdata:

networks:
  loan-net:
